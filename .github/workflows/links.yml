name: external-links

on:
  schedule:
    - cron: "0 1 * * 1"     # Mondays 01:00 UTC = 09:00 Kuala Lumpur
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  HUGO_VERSION: "0.169.0"   # Renovate keeps this in sync too

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Hugo extended
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      # Minify off: with baseURL "/", PaperMod's breadcrumb JSON-LD is missing a comma, and the minifier rejects it (see blog.yml)
      - name: Build
        env:
          HUGO_MINIFY_MINIFYOUTPUT: "false"
        run: hugo --gc --baseURL "/"

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check all links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --no-progress
            --cache --max-cache-age 3d
            --index-files index.html
            --root-dir ${{ github.workspace }}/public
            --remap "https://ahmadfakhrozy\.com file://${{ github.workspace }}/public"
            --accept '200..=299,429'
            --exclude '^https?://(www\.)?(linkedin|x|twitter)\.com/'
            --exclude '^https?://(localhost|127\.0\.0\.1|192\.168\.)'
            './public/**/*.html'

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken links report"
          content-filepath: ./lychee/out.md
