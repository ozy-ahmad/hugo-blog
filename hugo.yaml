# ============================================================================
# SITE BASICS
# ============================================================================
# If your site is in 'https', then make sure your base url isn't written using
# 'http' otherwise your sitemap would contain http URLs. This affects indexing.
baseURL: "https://ahmadfakhrozy.com/"
title: Ahmad Fakhrozy
theme: [PaperMod]

# ============================================================================
# BUILD OPTIONS
# ============================================================================
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["blog"]

# ============================================================================
# MINIFICATION
# ============================================================================
minify:
  disableXML: true
  minifyOutput: true

# ============================================================================
# PAGINATION
# ============================================================================
pagination:
  disableAliases: false
  pagerSize: 5

# ============================================================================
# TAXONOMIES
# ============================================================================
taxonomies:
  category: categories
  tag: tags
  series: series

# ============================================================================
# NAVIGATION MENU
# ============================================================================
menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: Blog
      url: /blog/
      weight: 5
    - name: Archive
      url: /archive/
      weight: 8
    - name: Tags
      url: /tags/
      weight: 10
    - name: 🔍
      url: /search/
      weight: 60

# ============================================================================
# OUTPUT FORMATS
# ============================================================================
outputs:
  home:
    - HTML
    - RSS
    - JSON

# ============================================================================
# SITE PARAMETERS
# ============================================================================
params:
  # Environment - enables google analytics, opengraph, twitter-cards, schema
  env: production
  description: "Ahmad Fakhrozy - Cloud Engineer"
  author: Ahmad Fakhrozy

  # --------------------------------------------------------------------------
  # Theme & Display Settings
  # --------------------------------------------------------------------------
  defaultTheme: light
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  # Default image for OpenGraph/Twitter cards
  images: ["images/papermod-cover.png"]

  # --------------------------------------------------------------------------
  # Profile Mode (Homepage)
  # --------------------------------------------------------------------------
  profileMode:
    enabled: true
    title: "Ahmad Fakhrozy"
    subtitle: "Cloud Platform Engineer with an SRE mindset, working with AWS, Microsoft Azure, Kubernetes, and Linux/Windows systems to build reliable, scalable platforms. Passionate about automation, observability, and continuous learning."
    imageUrl: "/profile.jpg"
    imageWidth: 150
    imageHeight: 150
    imageTitle: "Ahmad Fakhrozy"
    # buttons:
    #   - name: Blogs
    #     url: blog
    #   - name: Tags
    #     url: tags

  # --------------------------------------------------------------------------
  # Social Icons
  # --------------------------------------------------------------------------
  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/ozy-ahmad"
    - name: linkedin
      title: LinkedIn
      url: "https://www.linkedin.com/in/ahmad-fakhrozy-9069741a1/"
    - name: email
      title: Email
      url: "mailto:ahmadfakhrozy@gmail.com"

  # --------------------------------------------------------------------------
  # Assets (Favicons, etc.)
  # --------------------------------------------------------------------------
  assets:
    disableHLJS: true
    favicon: "/logo-192x192.png"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon-32x32.png"

# ============================================================================
# MARKDOWN RENDERING
# ============================================================================
markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML in markdown
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

# ============================================================================
# EXTERNAL SERVICES
# ============================================================================
services:
  googleAnalytics:
    ID: G-PENLQ3XLZ4
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
