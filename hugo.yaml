# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://ahmadfakhrozy.com/"
title: Ahmad Fakhrozy
# copyright is handled by PaperMod footer with dynamic year
theme: [PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["blog"]

minify:
  disableXML: true
  minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

taxonomies:
  category: categories
  tag: tags
  series: series

menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: Blog
      url: /blog/
      weight: 5
    - name: Archive
      url: /archive/
      weight: 8
    - name: Tags
      url: /tags/
      weight: 10
    - name: 🔍
      url: /search/
      weight: 60

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Ahmad Fakhrozy - Cloud Engineer"
  author: Ahmad Fakhrozy
  # author: ["Me", "You"] # multiple authors

  defaultTheme: light
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: true
    title: "Ahmad Fakhrozy"
    subtitle: "Cloud Platform Engineer with an SRE mindset, working with AWS, Microsoft Azure, Kubernetes, and Linux/Windows systems to build reliable, scalable platforms. Passionate about automation, observability, and continuous learning."
    imageUrl: "/images/profile.jpg"
    imageWidth: 150
    imageHeight: 150
    imageTitle: "Ahmad Fakhrozy"
    # buttons:
    #   - name: Blogs
    #     url: blog
    #   - name: Tags
    #     url: tags



  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/ozy-ahmad"
    - name: linkedin
      title: LinkedIn
      url: "https://www.linkedin.com/in/ahmad-fakhrozy-9069741a1/"
    - name: email
      title: Email
      url: "mailto:ahmadfakhrozy@gmail.com"



  assets:
    disableHLJS: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"



markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai


services:
  googleAnalytics:
    ID: G-PENLQ3XLZ4
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
