<!-- Search Modal with inline styles -->
<style>
    .search-modal {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 99999 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .search-modal.hidden {
        display: none !important;
    }

    .search-modal-backdrop {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        background: rgba(0, 0, 0, 0.5) !important;
        backdrop-filter: blur(4px);
    }

    .search-modal-content {
        position: relative !important;
        z-index: 1 !important;
        width: 90% !important;
        max-width: 600px !important;
        max-height: 80vh !important;
        background: #fff !important;
        border-radius: 12px !important;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25) !important;
        overflow: hidden !important;
    }

    .dark .search-modal-content,
    [data-theme="dark"] .search-modal-content {
        background: #1e1e1e !important;
    }

    .search-modal-header {
        display: flex !important;
        align-items: center !important;
        padding: 16px 20px !important;
        gap: 12px !important;
        border-bottom: 1px solid #eee !important;
    }

    .dark .search-modal-header,
    [data-theme="dark"] .search-modal-header {
        border-color: #333 !important;
    }

    .search-icon {
        color: #888;
        flex-shrink: 0;
    }

    #modal-search-input {
        flex: 1 !important;
        padding: 8px 0 !important;
        font-size: 18px !important;
        border: none !important;
        background: transparent !important;
        color: #333 !important;
        outline: none !important;
    }

    .dark #modal-search-input,
    [data-theme="dark"] #modal-search-input {
        color: #eee !important;
    }

    #modal-search-input::placeholder {
        color: #999;
    }

    .search-close-btn {
        padding: 8px !important;
        background: none !important;
        border: none !important;
        cursor: pointer !important;
        color: #888 !important;
        display: flex !important;
    }

    .search-close-btn:hover {
        color: #333;
    }

    .search-results {
        max-height: 60vh !important;
        overflow-y: auto !important;
    }

    .search-hint,
    .no-results {
        padding: 40px 20px !important;
        text-align: center !important;
        color: #888 !important;
    }

    .search-result-item {
        display: flex !important;
        align-items: center !important;
        padding: 16px 20px !important;
        text-decoration: none !important;
        color: #333 !important;
        border-bottom: 1px solid #f0f0f0 !important;
    }

    .dark .search-result-item,
    [data-theme="dark"] .search-result-item {
        color: #ddd !important;
        border-color: #2a2a2a !important;
    }

    .search-result-item:hover {
        background: #f5f5f5 !important;
    }

    .dark .search-result-item:hover,
    [data-theme="dark"] .search-result-item:hover {
        background: #2a2a2a !important;
    }

    .result-content {
        flex: 1;
        min-width: 0;
    }

    .result-title {
        display: block !important;
        font-weight: 600 !important;
        font-size: 15px !important;
        margin-bottom: 4px !important;
    }

    .result-summary {
        display: block !important;
        font-size: 13px !important;
        color: #666 !important;
        font-style: italic !important;
    }

    .result-arrow {
        color: #ccc !important;
        margin-left: 12px !important;
    }
</style>

<div id="search-modal" class="search-modal hidden">
    <div class="search-modal-backdrop" onclick="closeSearchModal()"></div>
    <div class="search-modal-content">
        <div class="search-modal-header">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="text" id="modal-search-input" placeholder="Search..." autocomplete="off">
            <button onclick="closeSearchModal()" class="search-close-btn" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="modal-search-results" class="search-results">
            <div class="search-hint">Type to search...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
    (function () {
        var modal = document.getElementById('search-modal');
        var input = document.getElementById('modal-search-input');
        var results = document.getElementById('modal-search-results');
        var fuse = null;

        fetch('{{ "index.json" | absURL }}')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                fuse = new Fuse(data, {
                    keys: ['title', 'summary', 'content'],
                    threshold: 0.3,
                    ignoreLocation: true
                });
            });

        window.openSearchModal = function () {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            input.value = '';
            results.innerHTML = '<div class="search-hint">Type to search...</div>';
            setTimeout(function () { input.focus(); }, 50);
        };

        window.closeSearchModal = function () {
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        };

        input.addEventListener('input', function () {
            var q = this.value.trim();
            if (!q) {
                results.innerHTML = '<div class="search-hint">Type to search...</div>';
                return;
            }
            if (!fuse) {
                results.innerHTML = '<div class="search-hint">Loading...</div>';
                return;
            }
            var found = fuse.search(q, { limit: 8 });
            if (!found.length) {
                results.innerHTML = '<div class="no-results">No results</div>';
                return;
            }
            results.innerHTML = found.map(function (r) {
                return '<a href="' + r.item.permalink + '" class="search-result-item">' +
                    '<div class="result-content">' +
                    '<span class="result-title">' + r.item.title + '</span>' +
                    (r.item.summary ? '<span class="result-summary">' + r.item.summary.substring(0, 80) + '...</span>' : '') +
                    '</div>' +
                    '<svg class="result-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' +
                    '</a>';
            }).join('');
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSearchModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                openSearchModal();
            }
        });

        document.querySelectorAll('a[href*="search"]').forEach(function (link) {
            if (link.href.indexOf('/search') > -1) {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    openSearchModal();
                });
            }
        });
    })();
</script>
